datasets:
  data:
    - muon
    - electron
    - muon_electron
  mc:
    - dy_nlo
    - tt
    - singletop
    - ww
    - wz
    - zz
    - wg
    - v+jets
    - gghtoww
    - vbfhtoww
    - zh
    - ggzh
    - gghto2tau
    - vbfhto2tau
    - whto2tau
    - whtoww
    - tthnonbb
    - tthtobb
    - hc
    - hb
object_selection:
  muons:
    field: events.Muon
    cuts:
      - events.Muon.pt > 10
      - np.abs(events.Muon.eta) < 2.4
      - working_points.muon_iso(events, 'tight')
      - working_points.muon_id(events, 'tight')
  electrons:
    field: events.Electron
    cuts:
      - events.Electron.pt > 10
      - np.abs(events.Electron.eta) < 2.5
      - working_points.electron_id(events, 'wp80iso')
      - delta_r_higher(events.Electron, objects['muons'], 0.4)
  leptons:
    field: select_hww_leptons
  ll_pair:
    field: select_hww_ll_pair
    cuts:
      - objects["ll_pair"].l1.pt > 20
      - objects["ll_pair"].l2.pt > 10
      - (objects["ll_pair"].l1 + objects["ll_pair"].l2).pt > 30
      - (objects["ll_pair"].l1.charge + objects["ll_pair"].l2.charge) == 0
      - (objects["ll_pair"].l1 + objects["ll_pair"].l2).mass > 12
  jets:
    field: events.Jet
    cuts:
      - events.Jet.pt > 20
      - np.abs(events.Jet.eta) < 2.4
      - working_points.jet_id(events, year, 'tightlepveto')
      - delta_r_higher(events.Jet, objects['leptons'], 0.4)
  eventJets:
    field: events.Jet
  cjets:
    field: events.Jet
    cuts:
      - events.Jet.pt > 20
      - np.abs(events.Jet.eta) < 2.4
      - working_points.jet_id(events, year, 'tightlepveto')
      - working_points.jet_ctagging(events, 'medium', year)
      - delta_r_higher(events.Jet, objects['leptons'], 0.4)
  candidate_cjet:
    field: select_candidate_cjet
  met:
    field: events.PuppiMET
  mTll:
    field: select_hww_mTll
  mTl1:
    field: select_hww_mTl1
  mTl2: 
    field: select_hww_mTl2
  leading_jets:
    field: select_leading_jets
  delta_phi:
    field: select_delta_phi
  delta_R:
    field: select_delta_R
event_selection:
  hlt_paths:
    MuonEG:
      - MuEle
    Muon:
      - SingleMu
    EGamma:
      - SingleEle
  selections:
    trigger: get_trigger_mask(events, hlt_paths, dataset, year)
    atleast_one_goodvertex: events.PV.npvsGood > 0
    lumimask: get_lumi_mask(events, year)
    met_filters: get_metfilters_mask(events, year)
    met_45: objects['met'].pt > 45
    one_electron: ak.num(objects['electrons']) == 1
    one_muon: ak.num(objects['muons']) == 1
    one_muon_one_electron: ak.all(((abs(objects['ll_pair'].l1.pdgId) == 11) & (abs(objects['ll_pair'].l2.pdgId) == 13)) | ((abs(objects['ll_pair'].l1.pdgId) == 13) & (abs(objects['ll_pair'].l2.pdgId) == 11)), axis=1)
    one_ll_pair: ak.num(objects['ll_pair']) == 1
    atleast_one_cjet: ak.num(objects['cjets']) > 0
    atleast_two_cjets: ak.num(objects['cjets']) > 1
    zero_jets: ak.num(objects['jets']) == 0
    zero_eventJets: ak.num(objects['eventJets']) == 0
    atleast_one_jet: ak.num(objects['jets']) > 0
    transverse_mass_signal: ak.all((objects["mTl2"] > 30) & (objects["mTll"] > 60), axis=1)
    transverse_mass_top_CR: ak.all((objects["mTl2"] > 30) & (objects["mTll"] <= 60), axis=1)
    dilepton_mass_signal: ak.all((objects["ll_pair"].l1 + objects["ll_pair"].l2).mass <= 72, axis=1)
    dilepton_mass_top_CR: ak.all((objects["ll_pair"].l1 + objects["ll_pair"].l2).mass > 72, axis=1)
  categories:
    base:
      - atleast_one_goodvertex
      - lumimask
      - met_filters
      - trigger
      - met_45
      - one_ll_pair
      - one_muon_one_electron
    base_atleast_one_cjet:
      - atleast_one_goodvertex
      - lumimask
      - met_filters
      - trigger
      - met_45
      - one_ll_pair
      - one_muon_one_electron
      - atleast_one_cjet
corrections:
  object:
    - jet
    - muon
    - electron
  object_shifts: false
  event_weights:
    genWeight: true
    pileupWeight: true
    partonshowerWeight: true
    lhepdfWeight: true
    lhescaleWeight: true
    nnlopsWeight: true
    muon:
      - id: tight
      - iso: tight
      - trigger: false
    electron:
      - id: wp80iso
      - reco: true
      - trigger: false
histogram_config:
  axes:
    dilepton_mass:
      type: Variable
      edges:
        - 0
        - 12
        - 20
        - 40
        - 60
        - 72
        - 80
        - 100
        - 120
        - 140
        - 160
        - 180
        - 200
        - 225
        - 250
        - 275
        - 300
        - 325
        - 350
        - 400
        - 450
        - 500
      label: $m(\ell\ell)$ [GeV]
      expression: (objects["ll_pair"].l1 + objects["ll_pair"].l2).mass
  layout:
    dilepton_mass:
      - dilepton_mass
  add_syst_axis: true
  add_weight: true


